name: Reminders

# Triggers the chore reminders at 16:00 and 19:00 Stockholm time. Vercel Hobby runs cron jobs at most
# once a day, so the schedule lives here. GitHub's cron is UTC: these runs cover both winter time
# (UTC+1: 15 and 18 UTC) and summer time (UTC+2: 14 and 17 UTC). The API works out the Stockholm slot
# itself and sends each user each slot once, so the extra runs (and GitHub's occasional delays) are harmless.
on:
  schedule:
    - cron: "5 14,15,17,18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the current reminder slot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set for this repository; skipping."
            exit 0
          fi
          curl -fsS --max-time 240 -X POST -H "Authorization: Bearer $CRON_SECRET" https://chorebacon.vercel.app/api/cron/reminders
